# Reek configuration for SolidObserver

detectors:
  Attribute:
    exclude:
      - SolidObserver::Configuration

  TooManyInstanceVariables:
    exclude:
      - SolidObserver::Configuration
      - SolidObserver::QueueEventBuffer
      - SolidObserver::JobsController
      - SolidObserver::EventsController
      - SolidObserver::Params::EventsFilter

  TooManyStatements:
    exclude:
      - SolidObserver::Generators::InstallGenerator#show_instructions
      - SolidObserver::CorrelationIdResolver#resolve
      - CreateSolidObserverQueueEvents#change
      - CreateSolidObserverMetrics#change
      - AddCompositeIndexesToQueueEvents#change
      - SolidObserver::QueueEventBuffer#flush!
      - SolidObserver::CLI::Base#table
      - SolidObserver::CLI::Base#confirm
      - SolidObserver::CLI::Status#print_queue_depths
      - SolidObserver::CLI::Jobs#retry_job
      - SolidObserver::CLI::Jobs#discard
      - SolidObserver::CLI::Storage#print_configuration
      - SolidObserver::JobsController#index
      - SolidObserver::EventsController#index
      - SolidObserver::Queries::EventsQuery#call

  LongParameterList:
    exclude:
      - SolidObserver::BaseMetric#increment
      - SolidObserver::BaseMetric#record
      - SolidObserver::Services::RecordEvent#self.call
      - SolidObserver::CLI::Jobs#list
      - SolidObserver::CLI::Jobs#fetch_job
      - SolidObserver::Params::EventsFilter#initialize

  UtilityFunction:
    enabled: false

  IrresponsibleModule:
    enabled: false

  FeatureEnvy:
    exclude:
      - CreateSolidObserverQueueEvents#change
      - CreateSolidObserverMetrics#change
      - CreateSolidObserverStorageInfo#change
      - SolidObserver::CLI::Base#confirm
      - SolidObserver::CLI::Status#print_queue_stats
      - SolidObserver::CLI::Status#print_queue_table
      - SolidObserver::CLI::Jobs#format_job_row
      - SolidObserver::CLI::Jobs#build_job_details
      - SolidObserver::CLI::Jobs#add_scheduled_details
      - SolidObserver::CLI::Jobs#fetch_jobs
      - SolidObserver::Configuration#validate_rate!
      - SolidObserver::Configuration#validate_positive_integer!
      - SolidObserver::Configuration#validate_positive_numeric!
      - SolidObserver::Queries::JobExecutionsQuery#apply_queue_filter
      - SolidObserver::ApplicationHelper#mode_badge

  DuplicateMethodCall:
    exclude:
      - SolidObserver::Generators::InstallGenerator#show_instructions
      - SolidObserver::CorrelationIdResolver#resolve
      - SolidObserver::CorrelationIdResolver#log_generator_error
      - SolidObserver::Services::CleanupStorage#check_storage_warnings
      - SolidObserver::QueueEventBuffer#flush!
      - SolidObserver::QueueEventBuffer#record_flush_failure
      - SolidObserver::Services::RecordEvent#handle_error
      - SolidObserver::CLI::Status#print_queue_stats
      - SolidObserver::CLI::Status#print_queue_table
      - SolidObserver::CLI::Status#print_queue_depths
      - SolidObserver::CLI::Jobs#add_error_details
      - SolidObserver::CLI::Jobs#scope_for_status
      - SolidObserver::CLI::Storage#print_configuration
      - SolidObserver::CLI::Storage#print_section_header
      - SolidObserver::CLI::Storage#print_storage_table

  InstanceVariableAssumption:
    exclude:
      - SolidObserver::Subscriber
      - SolidObserver::Services::CleanupStorage
      - SolidObserver::JobsController
      - SolidObserver::EventsController

  MissingSafeMethod:
    exclude:
      - SolidObserver::Subscriber
      - SolidObserver::QueueEventBuffer
      - SolidObserver::Configuration

  RepeatedConditional:
    exclude:
      - SolidObserver::CorrelationIdResolver#resolve
      - SolidObserver::CLI::Jobs

  UncommunicativeVariableName:
    accept:
      - e # Commonly used for exceptions
      - i # Standard index variable
      - t # Commonly used for time variables

  BooleanParameter:
    exclude:
      - SolidObserver::CLI::Base#confirm

  NilCheck:
    exclude:
      - SolidObserver::CLI::Base#confirm

  ControlParameter:
    exclude:
      - SolidObserver::CLI::Jobs#scope_for_status
      - SolidObserver::CLI::Jobs#apply_queue_filter
      - SolidObserver::CLI::Jobs#needs_job_join?
      - SolidObserver::StorageInfo#self.record_snapshot

  DataClump:
    exclude:
      - SolidObserver::CLI::Jobs
      - SolidObserver::Configuration

  TooManyMethods:
    exclude:
      - SolidObserver::CLI::Jobs
      - SolidObserver::QueueEventBuffer

exclude_paths:
  - spec/
