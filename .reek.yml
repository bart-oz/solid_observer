# Reek configuration for SolidObserver

detectors:
  Attribute:
    exclude:
      - SolidObserver::Configuration

  TooManyInstanceVariables:
    exclude:
      - SolidObserver::Configuration

  TooManyStatements:
    exclude:
      - SolidObserver::Configuration#initialize
      - SolidObserver::Generators::InstallGenerator#show_instructions
      - SolidObserver::CorrelationIdResolver#resolve
      - SolidObserver::CorrelationIdResolver#call_custom_generator

  UtilityFunction:
    enabled: false

  IrresponsibleModule:
    enabled: false

  DuplicateMethodCall:
    exclude:
      - SolidObserver::Generators::InstallGenerator#show_instructions
      - SolidObserver::CorrelationIdResolver#resolve
      - SolidObserver::CorrelationIdResolver#log_generator_error

  RepeatedConditional:
    exclude:
      - SolidObserver::CorrelationIdResolver#resolve

  UncommunicativeVariableName:
    accept:
      - e # Standard exception variable in rescue blocks
