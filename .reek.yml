# Reek configuration for SolidObserver

detectors:
  # Configuration classes legitimately have many writable attributes
  Attribute:
    exclude:
      - SolidObserver::Configuration

  # Configuration classes legitimately have many instance variables
  TooManyInstanceVariables:
    exclude:
      - SolidObserver::Configuration

  # Configuration initialization legitimately sets many default values
  TooManyStatements:
    exclude:
      - SolidObserver::Configuration#initialize
      - SolidObserver::Generators::InstallGenerator#show_instructions

  # Utility function is acceptable for private helper methods
  UtilityFunction:
    enabled: false

  # Module comments are optional for small gems
  IrresponsibleModule:
    enabled: false

  # Rails generators legitimately have repetitive say calls and multiple statements
  DuplicateMethodCall:
    exclude:
      - SolidObserver::Generators::InstallGenerator#show_instructions
